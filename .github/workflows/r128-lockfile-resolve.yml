name: R128 lockfile resolver

on:
  push:
    branches:
      - agent/r128-lockfile-resolve-r1

permissions:
  contents: read

jobs:
  resolve-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Resolve package lock
        run: |
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci
      - name: Verify Next build
        run: npm run build
      - name: Capture top-level resolution
        run: npm ls --depth=0 > r128-resolution.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r128-lockfile
          path: |
            package-lock.json
            r128-resolution.txt
          if-no-files-found: error
          retention-days: 1
