name: R128 lockfile resolver

on:
  push:
    branches:
      - agent/r128-lockfile-resolve-r1

permissions:
  contents: write

jobs:
  resolve-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Resolve package lock
        run: |
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci
      - name: Verify Next build
        run: npm run build
      - name: Capture top-level resolution
        run: npm ls --depth=0 > r128-resolution.txt
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already tracked and unchanged"
          else
            git commit -m "R128: add npm lockfile"
            git push origin HEAD:agent/r128-lockfile-resolve-r1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: r128-lockfile
          path: |
            package-lock.json
            r128-resolution.txt
          if-no-files-found: error
          retention-days: 1
