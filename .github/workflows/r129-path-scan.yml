name: R129 source path scan

on:
  push:
    branches:
      - agent/r129-lang-root-layout-prototype-r1

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Scan QA source path coupling
        shell: python
        run: |
          from pathlib import Path
          import re
          roots = [Path("scripts")]
          rx = re.compile(r"""app/(?:en/)?[^'"\s,;)}\]]*(?:page\.tsx|layout\.tsx)|app/(?:page\.tsx|layout\.tsx)""")
          hits = 0
          for root in roots:
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p.suffix not in {".py", ".js", ".mjs", ".ts"}:
                      continue
                  text = p.read_text(encoding="utf-8")
                  for n,line in enumerate(text.splitlines(),1):
                      if rx.search(line):
                          print(f"{p}:{n}:{line.strip()}")
                          hits += 1
          print(f"R129_PATH_SCAN_HITS={hits}")
