name: Static release QA

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  static-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static release
        run: python scripts/check_static_release.py
      - name: Validate commercial facts parity
        run: python scripts/check_commercial_parity.py
