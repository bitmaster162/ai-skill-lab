name: Static release QA

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  static-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static release
        run: python scripts/check_static_release.py
      - name: Validate search metadata
        run: python scripts/check_search_metadata.py
      - name: Validate llms.txt AEO directory
        run: python scripts/check_llms_txt.py
      - name: Validate structured data semantics
        run: python scripts/check_structured_data.py
      - name: Validate security headers and CSP hashes
        run: python scripts/check_security_headers.py
      - name: Enforce static performance budget
        run: python scripts/check_static_performance.py
      - name: Enforce transfer performance budget
        run: node scripts/check_transfer_performance.mjs
      - name: Validate contrast tokens
        run: python scripts/check_contrast_tokens.py
      - name: Validate motion policy
        run: python scripts/check_motion_policy.py
      - name: Validate static accessibility
        run: python scripts/check_static_accessibility.py
      - name: Validate homepage attention hierarchy
        run: python scripts/check_attention_hierarchy.py
      - name: Validate client privacy boundary
        run: python scripts/check_client_privacy.py
      - name: Validate inline client scripts
        run: python scripts/check_inline_scripts.py
      - name: Smoke-test matcher runtime
        run: node scripts/check_matcher_runtime.mjs
      - name: Smoke-test Start brief copy
        run: node scripts/check_start_runtime.mjs
      - name: Validate commercial facts parity
        run: python scripts/check_commercial_parity.py
      - name: Validate contact funnel
        run: python scripts/check_contact_funnel.py
      - name: Validate FAQ source-static parity
        run: python scripts/check_faq_parity.py
      - name: Validate parent RU/EN route parity
        run: python scripts/check_parent_route_parity.py
      - name: Validate Brief Compiler source-static parity
        run: python scripts/check_brief_compiler.py
      - name: Smoke-test Brief Compiler runtime
        run: node scripts/check_brief_compiler_runtime.mjs
      - name: Validate Business decision gate
        run: python scripts/check_business_decision_gate.py
      - name: Validate trust route parity
        run: python scripts/check_trust_route_parity.py
      - name: Validate youth route parity
        run: python scripts/check_youth_route_parity.py
      - name: Validate youth policy freshness
        run: python scripts/check_youth_policy_freshness.py
      - name: Validate navigation parity
        run: python scripts/check_navigation_parity.py
      - name: Validate Lab Command parity
        run: python scripts/check_lab_command.py
      - name: Validate Lab discoverability
        run: python scripts/check_lab_discoverability.py
      - name: Validate Project Studio parity
        run: python scripts/check_project_studio.py
      - name: Smoke-test Project Studio runtime
        run: node scripts/check_project_studio_runtime.mjs
      - name: Validate AI Pilot Simulator parity
        run: python scripts/check_pilot_simulator.py
      - name: Smoke-test AI Pilot Simulator runtime
        run: node scripts/check_pilot_simulator_runtime.mjs
      - name: Validate Business calculator determinism
        run: node scripts/check_r70_business_calculator.mjs
      - name: Validate curriculum package mapping
        run: python scripts/check_curriculum_package_mapping.py
      - name: Validate session duration policy
        run: python scripts/check_session_scope.py
      - name: Smoke-test Proof Lab runtime
        run: node scripts/check_proof_runtime.mjs
      - name: Validate AI Skill Graph parity
        run: python scripts/check_skill_graph.py
      - name: Smoke-test AI Skill Graph runtime
        run: node scripts/check_skill_graph_runtime.mjs
      - name: Validate AI System Challenge parity
        run: python scripts/check_system_challenge.py
      - name: Smoke-test AI System Challenge runtime
        run: node scripts/check_system_challenge_runtime.mjs
      - name: Validate Lab Hub
        run: python scripts/check_lab_hub.py
      - name: Smoke-test Lab Command runtime
        run: node scripts/check_lab_command_runtime.mjs
