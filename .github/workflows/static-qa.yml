name: Static release QA

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  static-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static release
        run: python scripts/check_static_release.py
      - name: Validate search metadata
        run: python scripts/check_search_metadata.py
      - name: Validate llms.txt AEO directory
        run: python scripts/check_llms_txt.py
      - name: Validate structured data semantics
        run: python scripts/check_structured_data.py
      - name: Validate security headers and CSP hashes
        run: python scripts/check_security_headers.py
      - name: Enforce static performance budget
        run: python scripts/check_static_performance.py
      - name: Validate contrast tokens
        run: python scripts/check_contrast_tokens.py
      - name: Validate motion policy
        run: python scripts/check_motion_policy.py
      - name: Validate inline client scripts
        run: python scripts/check_inline_scripts.py
      - name: Smoke-test matcher runtime
        run: node scripts/check_matcher_runtime.mjs
      - name: Smoke-test Start brief copy
        run: node scripts/check_start_runtime.mjs
      - name: Validate commercial facts parity
        run: python scripts/check_commercial_parity.py
      - name: Validate contact funnel
        run: python scripts/check_contact_funnel.py