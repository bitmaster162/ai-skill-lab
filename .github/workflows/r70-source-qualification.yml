name: R70 Source Qualification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://ai-skill-lab.vercel.app
      NEXT_PUBLIC_TELEGRAM_URL: https://t.me/BiTFormer
      NEXT_PUBLIC_LEAD_FORM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record toolchain
        run: |
          node --version
          npm --version
          python --version

      - name: Install and record resolved JS dependencies
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm ls --depth=0

      - name: Build R70 source application
        run: npm run build

      - name: Verify R70 business calculator determinism
        run: node scripts/check_r70_business_calculator.mjs

      - name: Verify R70 human-gated Telegram brief dispatchers
        run: node scripts/check_r70_source_dispatchers.mjs

      - name: Assert frozen R69 release identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("deploy/live/_release.json").read_text(encoding="utf-8"))
          assert release["release_id"] == "R69", release
          assert release["file_count"] == 55, release
          assert release["payload_sha256"] == "d9e63c4cbdc9e033bcd8257d7582903ebdcb17f09540c646413481028d31470c", release
          print("FROZEN_R69_IDENTITY_PASS files=55 payload_sha256=d9e63c4cbdc9e033bcd8257d7582903ebdcb17f09540c646413481028d31470c")
          PY
