name: R101B Cloudflare receiver QA

on:
  pull_request:
    paths:
      - 'services/lead-receiver-cloudflare/**'
      - '.github/workflows/r101b-receiver-qa.yml'
  push:
    branches:
      - 'agent/r101b-cloudflare-receiver-source-r1'
    paths:
      - 'services/lead-receiver-cloudflare/**'
      - '.github/workflows/r101b-receiver-qa.yml'

permissions:
  contents: read

jobs:
  receiver-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check receiver syntax
        run: node --check services/lead-receiver-cloudflare/src/index.js
      - name: Test Cloudflare lead receiver
        run: node --test services/lead-receiver-cloudflare/test/receiver.test.mjs
