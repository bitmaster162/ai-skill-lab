name: Single AI Skill Lab review ZIP, offline route check
on:
  push:
    branches:
      - 'qa/ci60-a679d188-20261125'
permissions:
  contents: read
jobs:
  verify-ci60:
    if: github.repository == 'bitmaster162/ai-skill-lab' && github.ref == 'refs/heads/qa/ci60-a679d188-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out QA sources separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
          persist-credentials: false
      - name: Check out the frozen public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bitmaster162/ai-skill-lab
          ref: a1b776f59d609a99b1ca162ade3aabdf72745a1b
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every immutable source commit for the reconstruction
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "a1b776f59d609a99b1ca162ade3aabdf72745a1b"
          for ref in a1b776f59d609a99b1ca162ade3aabdf72745a1b 2444bd77f7616ba916c37b2b3bcba11898926be0 0c87e0795f8e898ef06bacd4840579a1af5dac7b 5ca166f7a905c6887ae872fc6931b71ca76ac17a; do
            git cat-file -e "$ref^{commit}"
          done
      - name: Set up Python for the offline test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify the candidate recipes before running
        working-directory: qa/ci60
        run: |
          sha256sum --check <<'HASHES'
          e0379be6f433d91d011cf59c51384b4e8d3f926fd48e1171292f391ae9590d4d  from_git.py
          030e794a72df7715cb5757a83fea525bd9d12e3a9c976d375a9c60cb07f7b8c7  rebuild_and_verify.py
          9cca58a8f85ee3b5cb07cf8160bd1eabb75aa09a90b30d7345f1e11a2f75aab3  verify_ci60.py
          97c31d18e7f35dad28d7517189b08238069512c50021adcfc5911e0ef4945aa6  review_delta.json
          HASHES
      - name: Rebuild exact ZIP and run unchanged route contract
        run: python -B -X utf8 qa/ci60/from_git.py "$GITHUB_WORKSPACE/source"
