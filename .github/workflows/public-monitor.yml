name: Public GET monitor

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-get-monitor:
    if: ${{ vars.PUBLIC_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check five public GET targets
        env:
          PUBLIC_MONITOR_RELAY_SECRET: ${{ secrets.PUBLIC_MONITOR_RELAY_SECRET }}
        run: python scripts/public_monitor.py
