name: Next renderer language parity

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  language-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean install
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Validate T1.5 approved guide routes (read-only)
        run: python -B scripts/test_guide_route_admission.py
      - name: Build Next renderer
        run: npm run build
      - name: Verify generated html lang by canonical route
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import sys
          sys.path.insert(0, 'scripts')
          from guide_route_admission import admitted_route_count, require_route_set
          from phuket_release_profile import active as integrated_u1_release
          # Owner-reviewed U1 routes are admitted in Next source only.
          # Historical sealed static routes and SHA-256 source pins stay unchanged.
          U1_SOURCE_ONLY_ROUTES = frozenset({"/phuket-universe", "/en/phuket-universe"})

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.lang = None
                  self.canonical = None

              def handle_starttag(self, tag, attrs):
                  a = {k: (v or "") for k, v in attrs}
                  if tag == "html" and self.lang is None:
                      self.lang = a.get("lang")
                  if tag == "link" and "canonical" in a.get("rel", "").lower().split():
                      self.canonical = a.get("href")

          rows = {}
          for path in Path(".next/server/app").rglob("*.html"):
              parser = P()
              parser.feed(path.read_text(encoding="utf-8"))
              if not parser.canonical or "aiskillab.work" not in parser.canonical:
                  continue
              route = urlparse(parser.canonical).path or "/"
              if route != "/" and route.endswith("/"):
                  route = route.rstrip("/")
              if route in rows:
                  raise SystemExit(
                      f"LANG_PARITY_DUPLICATE_CANONICAL {route} {rows[route][0]} {path}"
                  )
              rows[route] = (path.as_posix(), parser.lang)

          try:
              missing_u1 = U1_SOURCE_ONLY_ROUTES.difference(rows)
              if missing_u1:
                  raise ValueError(f"U1 source-only pair missing={sorted(missing_u1)}")
              if integrated_u1_release():
                  require_route_set(rows, label="Next renderer R3 complete routes")
              else:
                  require_route_set(
                      (route for route in rows if route not in U1_SOURCE_ONLY_ROUTES),
                      label="Next renderer sealed-release baseline",
                  )
          except ValueError as exc:
              raise SystemExit(f"LANG_PARITY_ROUTE_ADMISSION_FAIL {exc}")

          bad = []
          ru = en = 0
          for route, (path, lang) in sorted(rows.items()):
              expected = "en" if route == "/en" or route.startswith("/en/") else "ru"
              if expected == "en":
                  en += 1
              else:
                  ru += 1
              if lang != expected:
                  bad.append((route, path, lang, expected))

          expected_per_locale = (admitted_route_count() + (0 if integrated_u1_release() else len(U1_SOURCE_ONLY_ROUTES))) // 2
          if ru != expected_per_locale or en != expected_per_locale:
              raise SystemExit(f"LANG_PARITY_LOCALE_COUNT_FAIL ru={ru} en={en}")
          if bad:
              for row in bad:
                  print("LANG_PARITY_FAIL", *row)
              raise SystemExit(1)

          print(f"LANG_PARITY_PASS routes={len(rows)} ru={ru} en={en} mismatches=0")
