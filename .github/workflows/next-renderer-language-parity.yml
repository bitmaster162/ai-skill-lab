name: Next renderer language parity

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  language-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: 0676a5c002ef15352d3ccb5cd3f67a49ecdc5131 # exact staged candidate before requesting its preview
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean install
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Validate T1.5 approved guide routes (read-only)
        run: python -B scripts/test_guide_route_admission.py
      - name: Check sealed bilingual guide successors and tamper fixtures
        run: node --test scripts/test_site_a2_guide_successor.mjs
      - name: Build Next renderer
        run: npm run build
      - name: Verify generated html lang by canonical route
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import sys
          sys.path.insert(0, 'scripts')
          from guide_route_admission import admitted_route_count, require_route_set
          from phuket_release_profile import active as integrated_u1_release
          # Owner-reviewed U1 routes are admitted in Next source only.
          # Historical sealed static routes and SHA-256 source pins stay unchanged.
          U1_SOURCE_ONLY_ROUTES = frozenset({"/phuket-universe", "/en/phuket-universe"})

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.lang = None
                  self.canonical = None

              def handle_starttag(self, tag, attrs):
                  a = {k: (v or "") for k, v in attrs}
                  if tag == "html" and self.lang is None:
                      self.lang = a.get("lang")
                  if tag == "link" and "canonical" in a.get("rel", "").lower().split():
                      self.canonical = a.get("href")

          rows = {}
          for path in Path(".next/server/app").rglob("*.html"):
              parser = P()
              parser.feed(path.read_text(encoding="utf-8"))
              if not parser.canonical or "aiskillab.work" not in parser.canonical:
                  continue
              route = urlparse(parser.canonical).path or "/"
              if route != "/" and route.endswith("/"):
                  route = route.rstrip("/")
              if route in rows:
                  raise SystemExit(
                      f"LANG_PARITY_DUPLICATE_CANONICAL {route} {rows[route][0]} {path}"
                  )
              rows[route] = (path.as_posix(), parser.lang)

          try:
              missing_u1 = U1_SOURCE_ONLY_ROUTES.difference(rows)
              if missing_u1:
                  raise ValueError(f"U1 source-only pair missing={sorted(missing_u1)}")
              if integrated_u1_release():
                  require_route_set(rows, label="Next renderer R3 complete routes")
              else:
                  require_route_set(
                      (route for route in rows if route not in U1_SOURCE_ONLY_ROUTES),
                      label="Next renderer sealed-release baseline",
                  )
          except ValueError as exc:
              raise SystemExit(f"LANG_PARITY_ROUTE_ADMISSION_FAIL {exc}")

          bad = []
          ru = en = 0
          for route, (path, lang) in sorted(rows.items()):
              expected = "en" if route == "/en" or route.startswith("/en/") else "ru"
              if expected == "en":
                  en += 1
              else:
                  ru += 1
              if lang != expected:
                  bad.append((route, path, lang, expected))

          expected_per_locale = (admitted_route_count() + (0 if integrated_u1_release() else len(U1_SOURCE_ONLY_ROUTES))) // 2
          if ru != expected_per_locale or en != expected_per_locale:
              raise SystemExit(f"LANG_PARITY_LOCALE_COUNT_FAIL ru={ru} en={en}")
          if bad:
              for row in bad:
                  print("LANG_PARITY_FAIL", *row)
              raise SystemExit(1)

          print(f"LANG_PARITY_PASS routes={len(rows)} ru={ru} en={en} mismatches=0")

      - name: Rebuild the two-card archive from the reviewed parent
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 255
        run: |
          python scripts/stage_first_tasks_card.py --parent restored --include-pilot \
            --output "$RUNNER_TEMP/AI-Skill-Lab-RU-guide-cards.zip"
          cd "$RUNNER_TEMP"
          echo "7456bda87a2baf08d75db7d12ee88bba28b2818ff495c2fd6fe325eefc2e1acf  AI-Skill-Lab-RU-guide-cards.zip" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Check routes and social cards in the archived site
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 255
        run: |
          review_checkout="$RUNNER_TEMP/guide-card-checkout"
          git worktree add --quiet --detach "$review_checkout" HEAD
          cd "$review_checkout"
          mv deploy/live "$RUNNER_TEMP/guide-card-original-site"
          unzip -q "$RUNNER_TEMP/AI-Skill-Lab-RU-guide-cards.zip" -d deploy/live
          python scripts/check_static_release.py
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree
          from check_og20_r1 import MetaParser, png_dimensions
          from public_origin import PUBLIC_ORIGIN

          live = Path("deploy/live")
          sitemap = ElementTree.parse(live / "sitemap.xml")
          routes = [node.text for node in sitemap.findall("{*}url/{*}loc")]
          assert len(routes) == len(set(routes)) == 60
          cards = json.loads(Path("guides/aiskillab/social-cards.json").read_text())
          for route in ("/guides/ai-first-tasks-for-adults", "/guides/ai-pilot-for-small-business"):
              assert PUBLIC_ORIGIN + route in routes, route
              card = cards[route]
              page = MetaParser()
              page.feed((live / (route.lstrip("/") + ".html")).read_text())
              for prefix in ("og", "twitter"):
                  assert page.meta[prefix + ":image"] == PUBLIC_ORIGIN + card["url"], route
                  assert page.meta[prefix + ":image:alt"] == card["alt"], route
              assert png_dimensions((live / card["url"].lstrip("/")).read_bytes()) == (1200, 630), route
              print(route, card["url"])
          PY

      - name: Save the verified release candidate for review
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 255
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aisl-ru-guide-cards-restored
          path: |
            ${{ runner.temp }}/AI-Skill-Lab-RU-guide-cards.zip
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
